<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mengerjakan Sumatif — KOKA</title>
<link rel="icon" href="../assets/images/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/asesmen.css">
</head>
<body class="halaman-app">

  <div class="hud-sumatif">
    <div class="container">
      <div class="info-siswa-hud">
        <b id="hud-nama-siswa">-</b>
        <span id="hud-detail-siswa">Kelas - • No. -</span>
      </div>
      <div class="timer-sumatif" id="timer-sumatif">30:00</div>
    </div>
  </div>

  <main class="halaman-isi">
    <div class="progres-soal-sumatif">
      <div class="progres-teks" id="progres-teks">Soal 1/5</div>
      <div class="progress-bar"><span id="progres-bar-isi" style="width:0%"></span></div>
    </div>

    <div class="peta-nomor-soal" id="peta-nomor-soal"></div>

    <div id="daftar-soal-sumatif"></div>

    <div class="wadah-navigasi-soal">
      <button class="btn btn-putih" id="btn-sebelumnya">◀ Sebelumnya</button>
      <button class="btn btn-oren" id="btn-selanjutnya">Selanjutnya ▶</button>
    </div>
  </main>

<footer class="footer-koka">KOKA © 2026<span class="nama-guru">Dibimbing oleh Ananda Dzikri Laila, M.Pd</span></footer>

<script src="../js/app.js"></script>
<script src="../js/config.js"></script>
<script src="../js/asesmen-soal.js"></script>
</body>
</html>
