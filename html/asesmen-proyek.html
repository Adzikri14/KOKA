<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumpulan Proyek — KOKA</title>
<link rel="icon" href="../assets/images/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/internal.css">
<link rel="stylesheet" href="../css/asesmen.css">
<link rel="stylesheet" href="../css/asesmen-menu.css">
</head>
<body class="halaman-app">

  <header class="topbar">
    <div class="container">
      <a class="btn-kembali" href="asesmen.html">←</a>
      <div>
        <h1>Pengumpulan Proyek</h1>
        <div class="topbar-sub">Kumpulkan hasil karya proyekmu di sini</div>
      </div>
    </div>
  </header>

  <main class="container halaman-isi dekorasi-form-asesmen">

    <div class="form-sumatif" id="form-wrap">
      <div class="ikon-badge-form ikon-badge-proyek">📁</div>
      <h3>Form Pengumpulan Proyek</h3>
      <p class="sub-form">Isi data berikut, lalu lampirkan proyekmu berupa link atau file</p>

      <div class="pesan-sukses-proyek" id="pesan-sukses">Proyek berhasil dikumpulkan! 🎉</div>

      <form id="form-proyek">
        <div class="input-grup">
          <label for="p-nama">Nama</label>
          <input type="text" id="p-nama" class="input-teks" readonly>
        </div>
        <div class="baris-2kolom">
          <div class="input-grup">
            <label for="p-kelas">Kelas</label>
            <input type="text" id="p-kelas" class="input-teks" readonly>
          </div>
          <div class="input-grup">
            <label for="p-presensi">No. Presensi</label>
            <input type="number" id="p-presensi" class="input-teks" placeholder="Contoh: 12" required min="1">
          </div>
        </div>

        <div class="input-grup">
          <label for="p-judul">Judul Proyek</label>
          <input type="text" id="p-judul" class="input-teks" placeholder="Contoh: Animasi Kucing Berlari - Scratch" required>
        </div>

        <div class="input-grup">
          <label>Cara Pengumpulan</label>
          <div class="pilihan-metode">
            <button type="button" id="btn-metode-link" class="aktif">🔗 Kirim Link</button>
            <button type="button" id="btn-metode-file">📎 Upload File</button>
          </div>
        </div>

        <div class="input-grup" id="wadah-input-link">
          <label for="p-link">Link Proyek</label>
          <input type="url" id="p-link" class="input-teks" placeholder="https://scratch.mit.edu/projects/xxxxx">
        </div>

        <div class="input-grup" id="wadah-input-file" style="display:none;">
          <label>Upload File Proyek (gambar/PDF/dokumen, maks 5MB)</label>
          <label class="wadah-upload-file" for="p-file">
            📎 Klik untuk memilih file
            <input type="file" id="p-file" accept="image/*,.pdf,.doc,.docx">
            <div class="nama-file-terpilih" id="nama-file-terpilih"></div>
          </label>
        </div>

        <button type="submit" class="btn btn-oren btn-block" id="btn-kirim-proyek">Kumpulkan Proyek 🚀</button>
      </form>
    </div>

  </main>

  <footer class="footer-koka">KOKA © 2026<span class="nama-guru">Dibimbing oleh Ananda Dzikri Laila, M.Pd</span></footer>

<script src="../js/app.js"></script>
<script src="../js/config.js"></script>
<script src="../js/asesmen-proyek.js"></script>
</body>
</html>
